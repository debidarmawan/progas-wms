name: Deploy Development

on:
  push:
    branches:
      - development # Hanya memicu workflow jika ada push ke branch development
  workflow_dispatch:

# Image dibangun di runner GitHub (16 GB), VPS hanya menarik image jadi.
# VPS dev RAM-nya terbatas: `next build` di dalam container pernah OOM-killed.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/debidarmawan/progas-wms

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:development
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # port: ${{ secrets.VPS_PORT }} # Hilangkan tanda # jika Anda memakai custom port SSH
          # passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            # Ganti path ini jika folder Anda berbeda
            cd /home/progas/progas-wms

            # Tarik pembaruan terbaru dari GitHub (compose file & env saja)
            git pull --ff-only origin development

            # Ambil image hasil CI, JANGAN build di server
            docker compose pull frontend
            docker compose up -d --no-build

            # Buang image lama supaya disk tidak penuh
            docker image prune -f

            # Smoke test: container baru butuh beberapa detik untuk bind port 3001
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://127.0.0.1:3001; then
                echo "frontend up after ${i} attempt(s)"
                exit 0
              fi
              sleep 2
            done

            echo "frontend tidak merespons di port 3001"
            docker logs --tail 50 progas-wms || true
            exit 1
