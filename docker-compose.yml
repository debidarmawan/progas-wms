# Frontend Next.js (standalone). Backend Go berjalan native/terpisah di VPS.
# NEXT_PUBLIC_API_BASE_URL dan API_PROXY_TARGET dapat diset lewat .env.

services:
  frontend:
    # Image is built by GitHub Actions (.github/workflows/deploy-dev.yml) and only
    # pulled on the VPS — `next build` never runs on the small dev server again.
    # `build:` stays so `docker compose up --build` still works locally.
    image: ghcr.io/debidarmawan/progas-wms:development
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    container_name: progas-wms
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:3131}
    extra_hosts:
      - "host.docker.internal:host-gateway"
